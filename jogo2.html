<!DOCTYPE html>
<html>
<head>
  <title>Jogo Adivinha o Número</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f0f0f0;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    #feedback {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>Adivinha o Número</h1>
<p>O computador escolheu um número entre 1 e 100. Tente adivinhar!</p>

<input type="number" id="guess" placeholder="Digite seu palpite" />
<button onclick="checkGuess()">Adivinhar</button>

<p id="feedback"></p>
<p id="attempts"></p>

<script>
  // Número aleatório entre 1 e 100
  const secretNumber = Math.floor(Math.random() * 100) + 1;
  let tries = 0;

  function checkGuess() {
    const input = document.getElementById("guess");
    const feedback = document.getElementById("feedback");
    const attempts = document.getElementById("attempts");
    const guess = Number(input.value);

    tries++;

    if (!guess || guess < 1 || guess > 100) {
      feedback.textContent = "Digite um número entre 1 e 100!";
      return;
    }

    if (guess === secretNumber) {
      feedback.textContent = `🎉 Parabéns! Você acertou o número ${secretNumber} em ${tries} tentativas.`;
      attempts.textContent = "";
    } else if (guess < secretNumber) {
      feedback.textContent = "⬆️ O número é maior!";
      attempts.textContent = `Tentativas: ${tries}`;
    } else {
      feedback.textContent = "⬇️ O número é menor!";
      attempts.textContent = `Tentativas: ${tries}`;
    }

    input.value = "";
    input.focus();
  }
</script>

</body>
</html>
